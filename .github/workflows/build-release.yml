name: Build & Release APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Local Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=AIzaSyPlaceholder" >> local.properties

      - name: Generate Release Keystore
        run: |
          rm -f release.keystore
          keytool -genkey -v \
            -keystore release.keystore \
            -alias ai-browser \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pass123456 \
            -keypass pass123456 \
            -dname "CN=AIBrowser, OU=Dev, O=AIPrivacyBrowser, L=Karachi, S=Sindh, C=PK"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=pass123456 \
            -Pandroid.injected.signing.key.alias=ai-browser \
            -Pandroid.injected.signing.key.password=pass123456 \
            --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Privacy-Browser-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
